<script>
/* Preview frames are decided before paint, so the real page doesn't flash on a computer.
   A computer with nothing chosen yet starts on Louis's wall tablet. A touch screen stays as it is. */
(function () {
  try {
    if (navigator.deviceMemory <= 2) document.documentElement.classList.add("modest");
    if (new URLSearchParams(location.search).has("embed")) return;
    var saved = JSON.parse(localStorage.getItem("screen-preview") || "null");
    var touch = (navigator.maxTouchPoints || 0) > 0 || (window.matchMedia && matchMedia("(pointer: coarse)").matches);
    if (!saved && !touch) {
      saved = { id: "tab-a-101-chrome-land", w: 1280, h: 752, label: "Galaxy Tab A 10.1 (2016), Louis's tablet · landscape, in Chrome · 1280 × 752" };
      localStorage.setItem("screen-preview", JSON.stringify(saved));
    }
    if (saved && saved.id && saved.id !== "actual" && saved.w > 0 && saved.h > 0) {
      document.documentElement.classList.add("preview-shell");
    }
  } catch (e) {}
})();
</script>

  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
  html, body { margin: 0; height: 100%; background: var(--page); color: var(--ink); overflow: hidden; }
  body { font: 16px/1.45 var(--font); padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
         -webkit-font-smoothing: antialiased; }
  .wrap { max-width: 1240px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px));
          padding-right: max(16px, env(safe-area-inset-right, 0px)); }
  button { font: inherit; color: inherit; }
  p { margin: 0; }
  :focus-visible { outline: 2.5px solid var(--brand-text); outline-offset: 2px; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .i { width: 20px; height: 20px; flex: none; }
  .muted { color: var(--ink-2); }
  .fine { font-size: 13px; line-height: 1.45; color: var(--ink-2); }

  /* the header */
  .top { padding-block: 18px 4px; }
  .top-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .title { display: flex; align-items: center; gap: 12px; min-width: 0; }
  .logo { width: 42px; height: 42px; border-radius: 13px; background: var(--brand); color: var(--on-brand); display: grid; place-items: center; flex: none; }
  .logo .i { width: 23px; height: 23px; }
  h1 { font-size: 24px; line-height: 1.15; margin: 0; letter-spacing: -0.015em; font-weight: 700; }
  .status { margin-top: 3px; font-size: 14px; color: var(--ink-2); display: flex; align-items: center; gap: 7px; min-height: 20px; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
  .dot.live { background: var(--good); animation: pulse 2.4s ease-out infinite; }
  html.modest .dot.live { animation: none; }
  .dot.late { background: var(--warning); }
  @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(12, 163, 12, 0.45); } 70%, 100% { box-shadow: 0 0 0 7px rgba(12, 163, 12, 0); } }
  .chip { display: inline-flex; align-items: center; gap: 7px; border: 1px solid var(--line); background: var(--surface); border-radius: 999px;
          padding: 8px 14px; font-size: 14px; font-weight: 550; cursor: pointer; white-space: nowrap; }
  .chip[aria-pressed="true"] { background: var(--brand); color: var(--on-brand); border-color: transparent; }
  .chip .i { width: 17px; height: 17px; }
  @media (max-width: 420px) { .chip .chip-text { display: none; } .chip { padding: 9px; } }

  /* the cards */
  .grid { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); grid-auto-flow: row dense; padding-block: 12px 20px; }
  .card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); padding: 18px; box-shadow: var(--shadow);
          min-width: 0; container-type: inline-size; }
  .card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px 12px; margin: 0 0 14px; min-height: 36px; flex-wrap: wrap; }
  h2 { font-size: 19px; line-height: 1.25; margin: 0; font-weight: 650; letter-spacing: -0.01em; text-wrap: balance; }
  .banner { display: flex; gap: 10px; align-items: flex-start; background: var(--note-bg); color: var(--note-ink); border-radius: 16px; padding: 12px 16px; font-size: 15px; }
  .note { display: flex; gap: 9px; align-items: flex-start; background: var(--note-bg); color: var(--note-ink); border-radius: 12px; padding: 10px 12px; font-size: 14px; }
  /* appliances (2026-11-14) */
  .appliance-table { width: 100%; border-collapse: collapse; font-size: 14px; font-variant-numeric: tabular-nums; }
  .appliance-table th { text-align: left; font-weight: 500; padding: 7px 0 7px 12px; }
  .appliance-table td { text-align: right; padding: 7px 12px 7px 0; white-space: nowrap; }
  .appliance-table tr + tr th, .appliance-table tr + tr td { border-top: 1px solid var(--line); }
  .appliance-table tr.sum th, .appliance-table tr.sum td { font-weight: 600; }
  /* where the money goes (2026-11-14) */
  .money-block { display: grid; gap: 6px; padding: 10px 0; border-top: 1px solid var(--line); }
  .money-block:first-child { border-top: 0; padding-top: 0; }
  .money-block p { margin: 0; }
  .money-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; font-size: 14px; }
  .money-list li { display: flex; justify-content: space-between; gap: 12px; }
  .money-list b { font-variant-numeric: tabular-nums; font-weight: 600; }
  .nights { width: 100%; height: 60px; display: block; }
  .nights rect { fill: var(--c-home); }
  .nights .typical { stroke: var(--ink-2); stroke-dasharray: 4 3; stroke-width: 1.5; vector-effect: non-scaling-stroke; }
  /* the price now and room for a wash or a dry (2026-11-13) */
  .room { display: grid; gap: 10px; border-top: 1px solid var(--line); padding-top: 12px; }
  .room p { margin: 0; }
  .room-price { display: flex; flex-wrap: wrap; align-items: baseline; gap: 2px 10px; font-size: 16px; }
  .start-free { margin-bottom: 12px; }
  .start-free p + p { margin-top: 4px; }
  .room-list { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  .room-list li { display: grid; grid-template-columns: auto minmax(0, 1fr); column-gap: 10px; row-gap: 2px; align-items: baseline; }
  .room-flag { grid-row: span 2; align-self: start; font-size: 13px; font-weight: 600; border-radius: 7px; padding: 2px 9px;
               border: 1px solid transparent; white-space: nowrap; }
  .room-flag.yes { color: var(--good-text); background: var(--good-wash); border-color: var(--good-line); }
  .room-flag.wait { color: var(--note-ink); background: var(--note-bg); }
  .room-flag.no { color: var(--critical); border-color: currentColor; }
  .room-name { font-weight: 600; font-size: 15px; }
  .shower-timer { margin-top: 10px; display: grid; gap: 6px; }
  .shower-timer .chips { margin: 0; }
  .note .i, .banner .i { width: 18px; height: 18px; margin-top: 1px; }
  .stack { display: grid; gap: 14px; }

  /* right now: the picture, drawn in isometric 3D like the FoxESS dashboard */
  .iso-scene { position: relative; max-width: 560px; margin: 0 auto; }
  .iso-scene svg { display: block; width: 100%; height: auto; overflow: visible; }
  .iso-label { position: absolute; transform: translate(0, -100%); white-space: nowrap; line-height: 1.15; pointer-events: none; }
  .iso-label.right { transform: translate(-100%, -100%); text-align: right; }
  .iso-label .k { font-size: 12.5px; color: var(--ink-2); }
  .iso-label .v { font-size: 21px; font-weight: 650; letter-spacing: -0.01em; }
  .iso-label .v small { font-size: 13px; font-weight: 550; color: var(--ink-2); margin-left: 2px; letter-spacing: 0; }
  @container (max-width: 380px) { .iso-label .v { font-size: 18px; } .iso-label .k { font-size: 12px; } }
  .iso-tile-top { fill: var(--iso-tile-top); } .iso-tile-side { fill: url(#iso-side); } .iso-soft { fill: var(--iso-soft); } .iso-shade { fill: var(--iso-shade); }
  .iso-wall-l { fill: var(--iso-wall-left); } .iso-wall-r { fill: var(--iso-wall-right); } .iso-roof { fill: var(--iso-roof); } .iso-roof-edge { fill: var(--iso-roof-edge); }
  .iso-window { fill: var(--iso-window); } .iso-door { fill: var(--iso-door); } .iso-trunk { fill: var(--iso-trunk); }
  .iso-leaf-1 { fill: var(--iso-leaf-1); } .iso-leaf-2 { fill: var(--iso-leaf-2); } .iso-leaf-3 { fill: var(--iso-leaf-3); }
  .iso-panel { fill: url(#iso-glass); stroke: var(--iso-frame); stroke-width: 0.9; stroke-linejoin: round; }
  .iso-cells { fill: none; stroke: var(--iso-panel-line); stroke-width: 0.6; }
  .iso-leg { stroke: var(--iso-leg); stroke-width: 1.4; stroke-linecap: round; }
  .iso-steel { fill: none; stroke: var(--iso-steel); stroke-width: 1.15; stroke-linecap: round; } .iso-wire { fill: none; stroke: var(--iso-wire); stroke-width: 0.8; }
  .iso-bat-t { fill: var(--iso-bat-top); } .iso-bat-l { fill: var(--iso-bat-left); } .iso-bat-r { fill: var(--iso-bat-right); }
  .iso-bat-window { fill: var(--iso-bat-window); } .iso-bat-level { fill: url(#iso-charge); } .iso-led { fill: var(--c-battery); }
  .iso-link { stroke: var(--iso-line); stroke-width: 2.2; stroke-linecap: round; }
  .iso-dots { fill: none; stroke-width: 4.2; stroke-linecap: round; stroke-dasharray: 0.01 12; animation: run var(--dur, 1s) linear infinite; }
  .iso-chev { display: none; fill: none; stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
  .iso-hub { fill: var(--iso-hub); stroke: var(--iso-hub-ring); stroke-width: 2.4; }
  @keyframes run { to { stroke-dashoffset: -12.01; } }
  @media (prefers-reduced-motion: reduce) {
    .iso-dots { display: none; }
    .iso-link.on { stroke: var(--c); }
    .iso-chev { display: inline; }
    .dot.live { animation: none; }
  }
  .now-tools { gap: 10px; }
  .live-badge { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 600; color: var(--good-text);
                border: 1px solid var(--good-line); background: var(--good-wash); border-radius: 7px; padding: 3px 9px; }
  .live-badge.late { color: var(--note-ink); border-color: var(--line); background: var(--note-bg); }
  .now-words { margin-top: 10px; }
  .story { font-size: 18px; line-height: 1.4; font-weight: 550; text-wrap: pretty; }
  .share-title { font-size: 13.5px; color: var(--ink-2); margin-bottom: 7px; }
  .share-bar { display: flex; gap: 2px; height: 12px; border-radius: 6px; overflow: hidden; }
  .share-bar span { min-width: 3px; background: var(--c); }
  .keys { display: flex; flex-wrap: wrap; gap: 4px 14px; margin: 8px 0 0; padding: 0; list-style: none; font-size: 13.5px; color: var(--ink-2); }
  .keys li { display: inline-flex; align-items: center; gap: 6px; }
  .keys b { color: var(--ink); font-weight: 650; }
  .sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; background: var(--c); flex: none; }
  .lk { display: inline-block; width: 14px; height: 3px; border-radius: 2px; background: var(--c); flex: none; }

  /* tiles */
  .tiles { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  @container (min-width: 540px) { .tiles { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  .tile { background: var(--well); border-radius: var(--r-tile); padding: 12px 14px 13px; min-width: 0; }
  .tile-label { font-size: 13px; color: var(--ink-2); display: flex; align-items: center; gap: 7px; }
  .tile-value { font-size: 26px; font-weight: 650; letter-spacing: -0.02em; margin-top: 4px; white-space: nowrap; line-height: 1.15; }
  .tile-value small { font-size: 14px; font-weight: 550; color: var(--ink-2); margin-left: 3px; letter-spacing: 0; }
  .tile-sub { font-size: 12.5px; color: var(--ink-2); margin-top: 3px; }

  /* controls */
  .tools { display: flex; align-items: center; gap: 8px; }
  .seg { display: inline-flex; background: var(--well); border-radius: 999px; padding: 3px; gap: 2px; max-width: 100%; }
  .seg button { border: 0; background: transparent; border-radius: 999px; padding: 7px 12px; font-size: 14px; font-weight: 550; color: var(--ink-2);
                cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 6px; white-space: nowrap; }
  .seg button .i { width: 18px; height: 18px; }
  .seg.icons button { padding: 6px 9px; }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1), 0 0 0 1px var(--line); }
  .seg.full { display: grid; grid-template-columns: repeat(4, minmax(0, auto)); justify-content: start; }
  .seg.modes { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); width: 100%; margin-bottom: 12px; }

  @container (max-width: 380px) { .seg.full { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); width: 100%; }
                                  .seg.full button { padding: 7px 4px; font-size: 13px; } }
  .icon-btn { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; width: 38px; height: 38px; display: inline-grid;

  .icon-btn .i { width: 18px; height: 18px; }
  .icon-btn:disabled { opacity: 0.35; cursor: default; }
  .btn { font-weight: 600; border: 0; border-radius: 999px; padding: 12px 20px; background: var(--brand); color: var(--on-brand); cursor: pointer; }
  .btn.quiet { background: transparent; color: var(--ink); border: 1px solid var(--line); }
  .link-btn { border: 1px solid var(--line); background: transparent; color: var(--ink); border-radius: 999px; padding: 5px 12px; font-size: 13.5px; cursor: pointer; }

  /* the energy card: supply above the line, use below, as in FoxESS's app */
  .card.busy .ec, .card.busy .tiles, .card.busy .table-wrap { opacity: 0.45; transition: opacity 0.2s; }
  .period { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 14px; }
  .period-nav { display: inline-flex; align-items: center; gap: 6px; min-width: 0; }
  .period-name { font-weight: 650; font-size: 15.5px; min-width: 6.5em; text-align: center; white-space: nowrap; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 16px 0 6px; }
  .chip-key { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); border-radius: 9px;
              padding: 5px 9px; font-size: 13px; font-weight: 550; cursor: pointer; color: var(--ink); }
  .chip-key[aria-pressed="false"] { color: var(--muted); }
  .chip-key[aria-pressed="false"] .sw { background: transparent; box-shadow: inset 0 0 0 1.5px var(--c); }
  .ec { position: relative; touch-action: pan-y; -webkit-user-select: none; user-select: none; border-radius: 10px; }
  .st-area { stroke: none; fill-opacity: 0.78; }
  .st-edge { fill: none; stroke-width: 1.3; stroke-linejoin: round; }
  .st-bar { stroke: none; }
  .tip { position: absolute; top: 6px; min-width: 214px; background: var(--tip-bg); color: var(--tip-ink); border-radius: 12px; padding: 10px 12px 9px;
         font-size: 13px; box-shadow: 0 10px 28px rgba(0, 0, 0, 0.22); pointer-events: none; z-index: 2; font-variant-numeric: tabular-nums; }
  .tip-time { font-weight: 650; margin-bottom: 5px; }
  .tip-row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 8px; align-items: center; line-height: 1.75; }
  .tip-row span { color: var(--tip-muted); white-space: nowrap; }
  .tip-row b { font-weight: 650; text-align: right; }
  .tip-gap { height: 4px; }
  .panel-head { display: flex; justify-content: space-between; align-items: baseline; gap: 2px 10px; flex-wrap: wrap; font-size: 13.5px; margin: 10px 0 2px; }
  .panel-title { font-weight: 600; color: var(--ink); }
  .panel-title small { font-weight: 400; color: var(--ink-2); font-size: 12.5px; margin-left: 4px; }
  .plot { display: block; overflow: visible; }
  .plot .gl { stroke: var(--gridline); stroke-width: 1; shape-rendering: crispEdges; }
  .plot .zero { stroke: var(--axis); stroke-width: 1.2; shape-rendering: crispEdges; }
  .plot .tick { fill: var(--muted); font-size: 11px; font-variant-numeric: tabular-nums; }
  .plot .dir { fill: var(--muted); font-size: 11px; }
  .plot .ln { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .plot .end { stroke: var(--surface); stroke-width: 2; }
  .plot .cross { stroke: var(--ink-2); stroke-width: 1; shape-rendering: crispEdges; }
  .plot .picked { fill: var(--ink); fill-opacity: 0.07; }

  /* tables */
  .table-wrap { overflow-x: auto; margin-top: 14px; border-radius: 12px; border: 1px solid var(--line); }
  table.data { width: 100%; border-collapse: collapse; font-size: 13.5px; font-variant-numeric: tabular-nums; }
  table.data th, table.data td { padding: 7px 9px; text-align: right; white-space: nowrap; border-bottom: 1px solid var(--line); }
  table.data th:first-child, table.data td:first-child { text-align: left; position: sticky; left: 0; background: var(--surface); }
  table.data thead th:first-child { background: var(--well); }
  table.data thead th { font-weight: 600; color: var(--ink-2); background: var(--well); }
  table.data tfoot th, table.data tfoot td { font-weight: 650; border-bottom: 0; }
  details.more { margin-top: 12px; }
  details.more summary { cursor: pointer; font-size: 14px; font-weight: 600; color: var(--brand-text); }

  /* best times */
  .bt-day + .bt-day { margin-top: 18px; padding-top: 16px; border-top: 1px solid var(--line); }
  .bt-head { display: flex; justify-content: space-between; align-items: baseline; gap: 4px 12px; flex-wrap: wrap; }
  .bt-name { font-weight: 650; font-size: 16px; }
  .bt-text { margin-top: 4px; font-size: 16px; text-wrap: pretty; }
  .strip { display: grid; grid-template-columns: repeat(24, minmax(0, 1fr)); gap: 2px; margin: 12px 0 5px; }
  .strip span { height: 30px; border-radius: 5px; background: var(--cell); }
  .strip .best { background: var(--good); }
  .strip .good { background: var(--good-soft); }
  .strip .past { opacity: 0.35; }
  .strip .now { box-shadow: 0 0 0 2px var(--surface), 0 0 0 3.5px var(--ink); }
  .hours { display: grid; grid-template-columns: repeat(24, minmax(0, 1fr)); gap: 2px; font-size: 11.5px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .hours span { white-space: nowrap; overflow: visible; }

  /* alerts */
  .alert { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: start; padding: 12px 0; border-top: 1px solid var(--line); }
  .alert-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; min-height: 30px; }
  .alert:first-child { border-top: 0; padding-top: 2px; }
  .badge { width: 34px; height: 34px; border-radius: 11px; display: grid; place-items: center; color: #ffffff; background: var(--s); }
  .badge.dark-icon { color: #0b0b0b; }
  .badge.plain { background: var(--well); color: var(--ink-2); }
  .badge .i { width: 18px; height: 18px; }
  .alert-title { font-weight: 600; text-wrap: pretty; }
  .alert-kind { font-size: 12.5px; color: var(--ink-2); font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; }
  .alert-details { font-size: 14px; color: var(--ink-2); margin-top: 3px; text-wrap: pretty; }
  .calm { display: flex; gap: 12px; align-items: center; }

  /* tariff bars */
  .tbars { display: grid; gap: 12px; }
  .tb-name { font-size: 14.5px; font-weight: 600; }
  .tb-sub { font-size: 13px; color: var(--ink-2); }
  .tb-row { display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: center; gap: 10px; margin-top: 5px; }
  .tb-track { height: 14px; }
  .tb-fill { height: 14px; border-radius: 0 4px 4px 0; background: var(--brand-text); min-width: 2px; }
  .tb-fill.now { background: var(--axis); }
  .tb-val { font-size: 14.5px; font-weight: 650; font-variant-numeric: tabular-nums; }
  .headline { font-size: 18px; font-weight: 600; margin-bottom: 12px; text-wrap: balance; }

  /* the shower */
  .big-figure { font-size: 30px; font-weight: 650; letter-spacing: -0.02em; line-height: 1.1; }
  .big-figure small { font-size: 15px; font-weight: 550; color: var(--ink-2); letter-spacing: 0; margin-left: 4px; }

  /* the footer and setting up */
  footer { padding-block: 4px 32px; font-size: 13px; color: var(--ink-2); display: grid; gap: 10px; }
  footer p { max-width: 75ch; }
  details.customise summary { cursor: pointer; font-weight: 600; color: var(--ink); font-size: 14px; }
  .checks { display: flex; flex-wrap: wrap; gap: 8px 18px; margin-top: 10px; }
  .checks label { display: inline-flex; align-items: center; gap: 7px; font-size: 14px; color: var(--ink); }
  .checks input { width: 18px; height: 18px; accent-color: var(--brand-text); }
  .field { display: block; margin: 14px 0 0; font-size: 15px; color: var(--ink-2); }
  .field input { display: block; width: 100%; margin-top: 6px; font: inherit; font-size: 17px; color: var(--ink); background: var(--well);
                 border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
  .actions { display: flex; gap: 10px; flex-wrap: wrap; margin: 16px 0 8px; }
  .lead { font-size: 18px; font-weight: 600; margin-bottom: 6px; }

  #banner:not(:empty) { padding-top: 12px; }
  @media (min-width: 720px) {
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 20px; }
    .card { padding: 22px; }
    #card-now, #card-energy, #card-best, #card-numbers, .wide { grid-column: 1 / -1; }
    #card-alerts, #card-shower { align-self: start; }
  }
  @media (min-width: 1100px) {
    .grid { grid-template-columns: repeat(12, minmax(0, 1fr)); }
    #card-best, #card-numbers { grid-column: span 7; }
    #card-alerts, #card-tariff, #card-shower { grid-column: span 5; }
    /* a wall screen: the live picture with the alerts under it, the energy chart beside both */
    .grid.live { grid-template-rows: auto 1fr; }
    .grid.live #card-now { grid-column: 1 / span 5; grid-row: 1; align-self: start; }
    .grid.live #card-alerts { grid-column: 1 / span 5; grid-row: 2; }
    .grid.live #card-energy { grid-column: 6 / span 7; grid-row: 1 / span 2; }
  }

  /* ---- wall tablet: the glance board, settings, dim night, preview frame ---- */
  body {
    background:
      radial-gradient(920px 420px at 0% -8%, rgba(227, 155, 18, 0.10), transparent 55%),
      radial-gradient(760px 380px at 100% 0%, rgba(15, 92, 85, 0.07), transparent 50%),
      var(--page);
  }
  .top { padding-block: 14px 2px; }
  .top-actions { display: flex; align-items: center; gap: 8px; flex: none; }
  #hero:not(:empty) { padding-top: 8px; }
  .demo-banner {
    display: block; background: #f4c14d; color: #2a2108;
    border-radius: 16px; padding: 12px 16px; font-size: 16px; font-weight: 650; line-height: 1.35;
  }
  .demo-banner span { font-weight: 750; }
  .glance {
    background: var(--surface); border: 1px solid var(--line); border-radius: 28px; box-shadow: var(--shadow);
    padding: 16px 16px 14px; display: grid; gap: 14px;
  }
  .glance-top { display: grid; gap: 14px; }
  .glance-battery { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 12px; align-items: center; }
  .ring-wrap { position: relative; width: 132px; height: 132px; flex: none; }
  .ring { width: 100%; height: 100%; display: block; }
  .ring-track { fill: none; stroke: var(--well); stroke-width: 10; }
  .ring-value { fill: none; stroke-width: 10; stroke-linecap: round; transform: rotate(-90deg); transform-origin: 60px 60px; }
  .ring-copy { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; pointer-events: none; }
  .ring-copy .pct { font-size: 40px; font-weight: 720; letter-spacing: -0.04em; line-height: 0.95; font-variant-numeric: tabular-nums; }
  .ring-copy .pct small { font-size: 16px; font-weight: 650; letter-spacing: 0; margin-left: 1px; }
  .ring-copy .sub { font-size: 13px; color: var(--ink-2); font-weight: 650; margin-top: 2px; }
  .glance-side { min-width: 0; display: grid; align-content: center; gap: 4px; }
  .glance-kicker { font-size: 13px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
  .hero-clock { font-size: clamp(28px, 4vw, 40px); font-weight: 720; letter-spacing: -0.03em; font-variant-numeric: tabular-nums; line-height: 1; }
  .glance-flow { font-size: 18px; color: var(--ink-2); text-wrap: pretty; font-weight: 650; }
  .metrics { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .metric { min-width: 0; padding: 8px 10px 9px; border-radius: 16px; }
  .metric.on { background: var(--well); }
  .metric .k { display: flex; align-items: center; gap: 6px; font-size: 13px; font-weight: 650; color: var(--ink-2); }
  .metric b { display: block; margin-top: 2px; font-size: clamp(26px, 7.2vw, 36px); font-weight: 720; letter-spacing: -0.035em; line-height: 1.05; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .metric b small { font-size: 0.42em; font-weight: 650; letter-spacing: 0; margin-left: 3px; color: var(--ink-2); }
  .metric .s { font-size: 12.5px; color: var(--muted); margin-top: 1px; }
  .dayline { display: grid; gap: 8px; }
  .dayline-head { display: flex; justify-content: space-between; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .price-pill { font-weight: 750; font-size: 16px; }
  .price-pill.cheap { color: var(--good-text); background: var(--good-wash); border-radius: 999px; padding: 6px 12px; box-shadow: inset 0 0 0 1px var(--good-line); }
  .daybar { position: relative; height: 28px; border-radius: 9px; background: var(--well); overflow: hidden; }
  .daybar .win { position: absolute; top: 0; bottom: 0; background: var(--c-battery); opacity: 0.85; }
  .daybar .now-mark { position: absolute; top: -3px; bottom: -3px; width: 3px; margin-left: -1.5px; background: var(--ink); border-radius: 2px; }
  .day-scale { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .win-pills { display: flex; flex-wrap: wrap; gap: 6px; }
  .win-pill { font-size: 13px; font-weight: 700; border-radius: 999px; padding: 4px 10px; background: var(--well); color: var(--ink-2); }
  .win-pill.now { background: var(--good-wash); color: var(--good-text); box-shadow: inset 0 0 0 1px var(--good-line); }
  .glance-alerts { display: grid; gap: 6px; }
  .glance-alert { font-size: 16px; font-weight: 650; text-wrap: pretty; padding: 8px 12px; border-radius: 12px; background: var(--well); border-left: 5px solid var(--warning); }
  .glance-alert.problem { color: var(--critical); border-left-color: var(--critical); }
  .glance-alert.money { border-left-color: var(--c-solar); }
  .glance-alert.watch { border-left-color: var(--warning); }
  .glance-alert.reminder { border-left-color: var(--c-home); }
  .glance-quiet { font-size: 15px; color: var(--good-text); font-weight: 700; }

  @media (min-width: 720px) {
    .glance { padding: 18px 20px 16px; }
    .ring-wrap { width: 156px; height: 156px; }
    .ring-copy .pct { font-size: 48px; }
    .metrics { grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .metric b { font-size: clamp(28px, 3.6vw, 42px); }
    .daybar { height: 34px; }
    .strip span { height: 36px; }
    h2 { font-size: 22px; }
    .tile-value { font-size: 32px; }
    .story { font-size: 22px; }
    .big-figure { font-size: 40px; }
  }
  @media (min-width: 1080px) {
    .glance-top { grid-template-columns: minmax(220px, 280px) minmax(0, 1fr); align-items: center; gap: 18px; }
    .glance-battery { grid-template-columns: auto minmax(0, 1fr); }
    .metrics { grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
    .metric b { font-size: clamp(30px, 2.8vw, 48px); }
    .hero-clock { font-size: 44px; }
    .glance-flow { font-size: 20px; }
    .tile-value { font-size: 34px; }
    .story { font-size: 24px; }
  }
  /* Galaxy Tab A 10.1 (2016), landscape: 1280×800 fullscreen, about 1280×752 once
     Android's status and navigation bars are on screen. Big figures, still one glance. */
  @media (min-width: 1180px) and (max-height: 860px) {
    .top { padding-block: 8px 0; }
    h1 { font-size: 22px; }
    .logo { width: 38px; height: 38px; }
    #hero:not(:empty) { padding-top: 4px; }
    .demo-banner { padding: 8px 14px; font-size: 15px; }
    .glance { padding: 12px 18px; gap: 10px; }
    .glance-top { grid-template-columns: minmax(320px, 360px) minmax(0, 1fr); gap: 12px; }
    .glance-flow { white-space: nowrap; }
    .ring-wrap { width: 128px; height: 128px; }
    .ring-copy .pct { font-size: 42px; }
    .hero-clock { font-size: 40px; }
    .glance-flow { font-size: 18px; }
    .metrics { gap: 4px 12px; }
    .metric { padding: 2px 8px 3px; }
    .metric b { font-size: 42px; }
    .dayline { gap: 5px; }
    .daybar { height: 26px; }
    .glance-alert { padding: 5px 12px; }
    .grid { padding-top: 8px; gap: 12px; }
  }
  @media (min-width: 720px) and (max-width: 900px) and (orientation: portrait) {
    .metric b { font-size: 36px; }
    .hero-clock { font-size: 40px; }
    .ring-wrap { width: 132px; height: 132px; }
    .ring-copy .pct { font-size: 42px; }
  }
  @media (max-width: 719px) and (orientation: portrait) {
    .glance-battery { grid-template-columns: 112px minmax(0, 1fr); }
    .ring-wrap { width: 112px; height: 112px; }
    .ring-copy .pct { font-size: 34px; }
  }

  /* dim night: darker than the ordinary dark theme, for a screen left on */
  html.dim:root {
    --page: #050706; --surface: #0e1210; --well: #171c19; --ink: #c5cdc7; --ink-2: #93a099; --muted: #7b867f;
    --line: rgba(255, 255, 255, 0.07); --gridline: #222824; --axis: #3a423d; --shadow: none;
    --brand: #7eaea3; --on-brand: #07110f; --brand-text: #93c4b8;
    --c-solar: #b88820; --c-home: #3b7cc4; --c-grid: #c45b82; --c-battery: #1e8f45;
    --good-text: #8dcc9a; --good-soft: #173224; --cell: #202623; --note-bg: #241f12; --note-ink: #ddd0a8;
    --good-line: rgba(141, 204, 154, 0.4); --good-wash: rgba(30, 143, 69, 0.16);
  }
  html.dim, html.dim body { background: #050706; color: var(--ink); }
  html.dim .demo-banner { background: #6e5618; color: #fff4d2; }
  html.care #board { transition: transform 1.8s ease-in-out; }
  html.modest.care #board, html.modest .glance { transition: none; box-shadow: none; }
  @media (prefers-reduced-motion: reduce) { html.care #board { transition: none; } }

  /* settings */
  dialog.settings {
    width: min(680px, calc(100vw - 24px)); max-height: min(92dvh, 900px); margin: auto; padding: 0;
    border: 1px solid var(--line); border-radius: 24px; background: var(--surface); color: var(--ink);
    box-shadow: 0 24px 80px rgba(0, 0, 0, 0.35);
  }
  dialog.settings::backdrop { background: rgba(6, 10, 9, 0.55); }
  .settings-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 16px 8px 20px; position: sticky; top: 0; background: var(--surface); border-radius: 24px 24px 0 0; }
  .settings-head h2 { font-size: 22px; }
  #settings-body { padding: 4px 20px 22px; display: grid; gap: 18px; }
  .set-block { display: grid; gap: 8px; }
  .set-block h3 { margin: 0; font-size: 13px; letter-spacing: 0.07em; text-transform: uppercase; color: var(--muted); font-weight: 750; }
  .set-help { font-size: 14.5px; color: var(--ink-2); }
  .choice { display: grid; gap: 8px; }
  .choice label, .set-check { display: flex; gap: 10px; align-items: flex-start; font-size: 16px; font-weight: 600; padding: 10px 12px; border: 1px solid var(--line); border-radius: 14px; background: var(--well); }
  .choice input, .set-check input { width: 20px; height: 20px; margin-top: 2px; accent-color: var(--brand-text); flex: none; }
  .set-select, .set-num {
    width: 100%; font: inherit; font-size: 16px; color: var(--ink); background: var(--well);
    border: 1px solid var(--line); border-radius: 12px; padding: 12px; min-height: 48px;
  }
  .set-nums { display: flex; gap: 8px; align-items: center; }
  .set-nums span { color: var(--muted); font-weight: 700; }
  .set-num { width: 8em; }
  dialog .checks { margin-top: 0; }

  /* computer preview: the app sits in a frame of the chosen size */
  html.preview-shell, html.preview-shell body { background: #12171c; overflow: hidden; height: 100%; }
  html.preview-shell body > :not(#preview-root) { display: none !important; }
  #preview-root { height: 100dvh; display: grid; grid-template-rows: auto minmax(0, 1fr); color: #e7ece9; }
  .preview-bar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding: 12px 16px 8px; }
  .preview-bar strong { font-size: 15px; }
  .preview-bar .scale-note { color: #aeb8b4; font-size: 14px; }
  .preview-bar select, .preview-bar input[type="number"] {
    font: inherit; font-size: 14px; color: #e7ece9; background: #1d252c; border: 1px solid #334049;
    border-radius: 10px; padding: 8px 10px; min-height: 40px;
  }
  .preview-bar input[type="number"] { width: 5.5em; }
  .preview-cal, .card-match { flex-basis: 100%; display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; }
  .preview-cal[hidden], .card-match[hidden] { display: none; }
  .card-match p { flex-basis: 100%; margin: 0; color: #c5cdc8; font-size: 14px; }
  .card-bar { position: relative; height: 54px; background: #f7f4ee; border-radius: 8px; box-shadow: inset 0 0 0 2px #e0b03a; }
  .card-handle { position: absolute; top: 0; right: -10px; width: 20px; height: 54px; border: 0; border-radius: 6px; background: #e0b03a; cursor: ew-resize; }
  .preview-stage { display: grid; place-items: center; min-height: 0; overflow: auto; padding: 8px 16px 16px; }
  .preview-stage.overflowing { place-items: start center; }
  .bezel { position: relative; background: #0c1014; border-radius: 36px; padding: 36px 16px 16px; box-shadow: 0 30px 80px rgba(0, 0, 0, 0.45), inset 0 0 0 2px #2a333b; }
  .bezel.phone { border-radius: 42px; padding: 32px 12px 12px; }
  .scale-badge { position: absolute; top: 8px; right: 16px; z-index: 2; background: #243028; color: #f4f7f5; font-size: 13px; font-weight: 750; letter-spacing: 0.02em; border-radius: 999px; padding: 3px 9px; }
  .bezel-fit { overflow: hidden; border-radius: 18px; background: #e6eeea; }
  .bezel-fit iframe { border: 0; display: block; background: #e6eeea; }

  /* four full-screen pages, swiped sideways. Nothing on the page scrolls up and down. */
  #board { height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; overflow: hidden; }
  #banner:empty { display: none; }
  #banner:not(:empty) { padding: 6px 12px 0; }

function shareBar(title, parts) {
  // a part-to-whole bar: [[colour key, label, amount], ...]
  const shown = parts.filter(p => p[2] > 0.005), total = shown.reduce((a, p) => a + p[2], 0);
  if (!total) return "";
  const pct = shown.map(p => Math.round(p[2] / total * 100));
  return `<div class="share"><div class="share-title">${esc(title)}</div>
    <div class="share-bar" role="img" aria-label="${esc(title + ": " + shown.map((p, i) => `${p[1]} ${pct[i]}%`).join(", "))}">${shown.map(p =>
      `<span style="flex: ${(p[2] / total * 1000).toFixed(1)} 1 0; --c: var(--c-${p[0]})"></span>`).join("")}</div>
    <ul class="keys">${shown.map((p, i) => `<li><i class="sw" style="--c: var(--c-${p[0]})"></i><b>${pct[i]}%</b>${esc(p[1])}</li>`).join("")}</ul></div>`;
}

// ---- right now: a picture of where the power is going, in the style of the FoxESS dashboard
function flows(r) {
  const v = k => Math.max(0, num(r[k]) || 0);
  return { solar: v("solar_kw"), house: v("house_kw"), buy: v("buying_kw"), sell: v("selling_kw"),
           charge: v("battery_charge_kw"), give: v("battery_discharge_kw"), pct: num(r.battery_percent) };
}

function story(r) {
  const f = flows(r);
  if (f.house < ON_KW) {
    const spare = [f.charge >= ON_KW && "charging the battery", f.sell >= ON_KW && "going to the grid"].filter(Boolean);
    return f.solar >= 0.05 && spare.length ? `Solar is making ${kw(f.solar)} kW. The house needs almost nothing, so it's ${and(spare)}.`
                                           : "The house is using almost nothing right now.";
  }
  const from = [f.give >= ON_KW && "the battery", f.buy >= ON_KW && "the grid"].filter(Boolean);
  const spare = [f.charge >= ON_KW && "charging the battery", f.sell >= ON_KW && "going to the grid"].filter(Boolean);
  let text;
  if (f.solar < 0.05) text = `No solar right now: the house is running on ${and(from) || "the battery"}.`;
  else if (f.solar >= f.house * 0.97) text = `Solar is covering everything the house is using${spare.length ? `, and the spare is ${and(spare)}` : ""}.`;
  else text = `Solar is covering about ${Math.round(f.solar / f.house * 100)}% of what the house is using. The rest is coming from ${and(from) || "the battery"}.`;
  if (f.charge >= ON_KW && f.buy >= ON_KW && f.solar < 0.05) text += " The battery is charging from the grid.";
  return text;
}

// The picture is drawn here in isometric 3D (x runs down to the right, y down to the left, z up), from
// simple shapes: nothing in it is copied from FoxESS's own artwork. Colours come from the --iso tokens.
const C30 = Math.cos(Math.PI / 6), TILE = 104, GAP = 146, THICK = 9;
const SCENE = { x: -228, y: -226, w: 456, h: 432 };
function iso(x, y, z = 0) { return [(x - y) * C30, (x + y) * 0.5 - z]; }
function f1(n) { return n.toFixed(1); }
function xy(p) { return `${f1(p[0])},${f1(p[1])}`; }
function face(points, cls) { return `<path class="${cls}" d="M${points.map(p => xy(iso(...p))).join("L")}Z"/>`; }
function block(x, y, z, w, d, h, [top, left, right]) {
  return face([[x, y, z + h], [x + w, y, z + h], [x + w, y + d, z + h], [x, y + d, z + h]], top) +
         face([[x, y + d, z], [x + w, y + d, z], [x + w, y + d, z + h], [x, y + d, z + h]], left) +
         face([[x + w, y, z], [x + w, y + d, z], [x + w, y + d, z + h], [x + w, y, z + h]], right);
}
function seg(a, b, cls) { const p = iso(...a), q = iso(...b); return `<line class="${cls}" x1="${f1(p[0])}" y1="${f1(p[1])}" x2="${f1(q[0])}" y2="${f1(q[1])}"/>`; }
function outline(cx, cy, half, r) {                 // a rounded square on the ground, as (x, y) points
  const pts = [];
  for (const [sx, sy, a0] of [[1, 1, 0], [-1, 1, 90], [-1, -1, 180], [1, -1, 270]])
    for (let k = 0; k <= 6; k++) { const a = (a0 + k * 15) * Math.PI / 180; pts.push([cx + sx * (half - r) + r * Math.cos(a), cy + sy * (half - r) + r * Math.sin(a)]); }
  return pts;
}

function tileSvg(cx, cy) {
  const pts = outline(cx, cy, TILE / 2, 16), top = pts.map(([x, y]) => iso(x, y, THICK));
  const shadow = (grow, drop) => `<path class="iso-soft" d="M${outline(cx, cy, TILE / 2 + grow, 16 + grow).map(([x, y]) => xy(iso(x, y, -drop))).join("L")}Z"/>`;
  // the side that can be seen: the outline from its leftmost point to its rightmost, along the front
  let iL = 0, iR = 0;
  top.forEach((p, i) => { if (p[0] < top[iL][0]) iL = i; if (p[0] > top[iR][0]) iR = i; });
  const n = pts.length, walk = dir => { const out = []; for (let i = iL; ; i = (i + dir + n) % n) { out.push(i); if (i === iR) break; } return out; };
  const a = walk(1), b = walk(-1), low = list => Math.max(...list.map(i => top[i][1]));
  const front = low(a) > low(b) ? a : b;
  const side = front.map(i => iso(pts[i][0], pts[i][1], THICK)).concat(front.slice().reverse().map(i => iso(pts[i][0], pts[i][1], 0)));
  return shadow(2, 7) + shadow(6, 10) + `<path class="iso-tile-side" d="M${side.map(xy).join("L")}Z"/><path class="iso-tile-top" d="M${top.map(xy).join("L")}Z"/>`;
}

function houseSvg(cx, cy) {
  const w = 58, d = 46, h = 30, rh = 19, o = 4, x = cx - w / 2 + 2, y = cy - d / 2 + 2, z = THICK;
  const drop = o * rh / (d / 2), ridge = z + h + rh, eave = z + h - drop, th = 2.6;
  let s = "";
  // a tree behind, to the right
  const tx = cx + 34, ty = cy - 30;
  s += face([[tx - 10, ty - 6, z + 0.2], [tx + 12, ty - 6, z + 0.2], [tx + 12, ty + 12, z + 0.2], [tx - 10, ty + 12, z + 0.2]], "iso-shade");
  s += block(tx - 1.5, ty - 1.5, z, 3, 3, 14, ["iso-trunk", "iso-trunk", "iso-trunk"]);
  const c = iso(tx, ty, z + 26), c2 = iso(tx + 6, ty - 4, z + 20), c3 = iso(tx - 5, ty + 5, z + 19);
  s += `<circle class="iso-leaf-2" cx="${f1(c2[0])}" cy="${f1(c2[1])}" r="10"/><circle class="iso-leaf-2" cx="${f1(c3[0])}" cy="${f1(c3[1])}" r="9.5"/>` +
       `<circle class="iso-leaf-1" cx="${f1(c[0])}" cy="${f1(c[1])}" r="12"/><circle class="iso-leaf-3" cx="${f1(c[0] - 4)}" cy="${f1(c[1] - 4)}" r="5.5"/>`;
  // its shadow, the walls and the gable end
  s += face([[x + w, y, z + 0.2], [x + w + 16, y + 6, z + 0.2], [x + w + 16, y + d + 10, z + 0.2], [x + 6, y + d + 10, z + 0.2], [x, y + d, z + 0.2]], "iso-shade");
  s += block(x, y, z, w, d, h, ["iso-wall-r", "iso-wall-l", "iso-wall-r"]);
  s += face([[x + w, y, z + h], [x + w, y + d, z + h], [x + w, y + d / 2, ridge]], "iso-wall-r");
  // windows along the front, a door and a window at the end
  for (const wx of [x + 8, x + 24, x + 40]) s += face([[wx, y + d, z + 11], [wx + 10, y + d, z + 11], [wx + 10, y + d, z + 22], [wx, y + d, z + 22]], "iso-window");
  s += face([[x + w, y + 25, z], [x + w, y + 36, z], [x + w, y + 36, z + 19], [x + w, y + 25, z + 19]], "iso-door");
  s += face([[x + w, y + 8, z + 11], [x + w, y + 18, z + 11], [x + w, y + 18, z + 21], [x + w, y + 8, z + 21]], "iso-window");
  // the roof's front slope (the back one is hidden behind it), with its edges showing over the gable
  s += face([[x + w + o, y - o, eave], [x + w + o, y + d / 2, ridge], [x + w + o, y + d / 2, ridge - th], [x + w + o, y - o, eave - th]], "iso-roof-edge");
  s += face([[x - o, y + d / 2, ridge], [x + w + o, y + d / 2, ridge], [x + w + o, y + d + o, eave], [x - o, y + d + o, eave]], "iso-roof");
  s += face([[x + w + o, y + d / 2, ridge], [x + w + o, y + d + o, eave], [x + w + o, y + d + o, eave - th], [x + w + o, y + d / 2, ridge - th]], "iso-roof-edge");
  s += face([[x - o, y + d + o, eave], [x + w + o, y + d + o, eave], [x + w + o, y + d + o, eave - th], [x - o, y + d + o, eave - th]], "iso-roof-edge");
  // a chimney on the slope
  const cyy = y + d * 0.66, roofAt = ridge - (cyy - (y + d / 2)) * rh / (d / 2);
  return s + block(x + w * 0.66, cyy, roofAt - 4, 6, 6, 13, ["iso-wall-r", "iso-wall-l", "iso-wall-r"]);
}

function solarSvg(cx, cy) {
  const z = THICK, pw = 21, pl = 30, tilt = 30 * Math.PI / 180, lift = 7, cs = Math.cos(tilt), sn = Math.sin(tilt);
  let s = "";
  for (const by of [cy - 14, cy + 26]) {                 // the back row first
    for (let k = 0; k < 3; k++) {
      const px = cx - 36 + k * (pw + 3), top = [by - pl * cs, z + lift + pl * sn];
      for (const [lx, ly, lz] of [[px + 3, by, z + lift], [px + pw - 3, by, z + lift], [px + 3, top[0], top[1]], [px + pw - 3, top[0], top[1]]]) {
        s += seg([lx, ly, lz], [lx, ly, z], "iso-leg");
      }
      s += face([[px, by, z + lift], [px + pw, by, z + lift], [px + pw, top[0], top[1]], [px, top[0], top[1]]], "iso-panel");
      let cells = "";
      const p1 = iso(px + pw / 2, by, z + lift), p2 = iso(px + pw / 2, top[0], top[1]);
      cells += `M${xy(p1)}L${xy(p2)}`;
      for (let j = 1; j < 4; j++) {
        const v = j / 4, a = iso(px, by - pl * cs * v, z + lift + pl * sn * v), b = iso(px + pw, by - pl * cs * v, z + lift + pl * sn * v);
        cells += `M${xy(a)}L${xy(b)}`;
      }
      s += `<path class="iso-cells" d="${cells}"/>`;
    }
  }
  return s;
}

function pylonSvg(cx, cy, H) {
  const z = THICK, b = 8, b2 = 2.6, levels = [0, 0.22, 0.42, 0.6, 0.76, 0.9];
  const corner = (u, sx, sy) => { const half = b + (b2 - b) * u; return [cx + sx * half, cy + sy * half, z + H * u]; };
  let d = "";
  const line = (p, q) => { d += `M${xy(iso(...p))}L${xy(iso(...q))}`; };
  for (const [sx, sy] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) line(corner(0, sx, sy), corner(0.9, sx, sy));
  for (let i = 0; i < levels.length - 1; i++) {        // cross-bracing on the two faces that can be seen
    const u0 = levels[i], u1 = levels[i + 1];
    line(corner(u0, 1, -1), corner(u1, 1, 1)); line(corner(u0, 1, 1), corner(u1, 1, -1));
    line(corner(u0, -1, 1), corner(u1, 1, 1)); line(corner(u0, 1, 1), corner(u1, -1, 1));
    line(corner(u1, -1, 1), corner(u1, 1, 1)); line(corner(u1, 1, -1), corner(u1, 1, 1));
  }
  const peak = [cx, cy, z + H * 1.02], arms = [];
  for (const [sx, sy] of [[-1, -1], [1, -1], [1, 1], [-1, 1]]) line(corner(0.9, sx, sy), peak);
  for (const [u, len] of [[0.6, 17], [0.76, 13]]) {       // two cross-arms with insulators
    const zz = z + H * u, half = b + (b2 - b) * u;
    line([cx - len, cy, zz], [cx + len, cy, zz]);
    line([cx - len, cy, zz], [cx - half, cy, zz - 5]); line([cx + len, cy, zz], [cx + half, cy, zz - 5]);
    for (const sx of [-1, 1]) { line([cx + sx * (len - 1), cy, zz], [cx + sx * (len - 1), cy, zz - 4]); arms.push([cx + sx * (len - 1), cy, zz - 4]); }
  }
  return { svg: `<path class="iso-steel" d="${d}"/>`, arms };
}

function gridSvg(cx, cy) {
  const z = THICK + 0.2, back = pylonSvg(cx + 2, cy - 30, 74), front = pylonSvg(cx - 2, cy + 22, 74);
  let wires = "";
  back.arms.forEach((a, i) => {
    const p = iso(...a), q = iso(...front.arms[i]);
    wires += `M${xy(p)}Q${xy([(p[0] + q[0]) / 2, (p[1] + q[1]) / 2 + 7])} ${xy(q)}`;
  });
  return face([[cx - 9, cy - 39, z], [cx + 13, cy - 39, z], [cx + 13, cy - 21, z], [cx - 9, cy - 21, z]], "iso-shade") +
         face([[cx - 13, cy + 13, z], [cx + 9, cy + 13, z], [cx + 9, cy + 31, z], [cx - 13, cy + 31, z]], "iso-shade") +
         back.svg + `<path class="iso-wire" d="${wires}"/>` + front.svg;
}

function batterySvg(cx, cy, pct) {
  const w = 30, d = 22, h = 60, x = cx - w / 2, y = cy - d / 2, z = THICK;
  let s = face([[x + w, y, z + 0.2], [x + w + 14, y + 6, z + 0.2], [x + w + 14, y + d + 8, z + 0.2], [x + 4, y + d + 8, z + 0.2], [x, y + d, z + 0.2]], "iso-shade");
  s += block(x, y, z, w, d, h, ["iso-bat-t", "iso-bat-l", "iso-bat-r"]);
  s += block(x - 1.2, y - 1.2, z + h, w + 2.4, d + 2.4, 3, ["iso-bat-t", "iso-bat-l", "iso-bat-r"]);
  // the level, in a window on the front: as full as the battery
  const x0 = x + 5, x1 = x + w - 5, z0 = z + 6, z1 = z + h - 12, level = z0 + (z1 - z0) * Math.max(0, Math.min(100, pct)) / 100;
  s += face([[x0, y + d, z0], [x1, y + d, z0], [x1, y + d, z1], [x0, y + d, z1]], "iso-bat-window");
  if (pct > 0) s += face([[x0, y + d, z0], [x1, y + d, z0], [x1, y + d, level], [x0, y + d, level]], "iso-bat-level");
  const led = iso(x + w, y + d / 2, z + h - 7);
  return s + `<circle class="iso-led" cx="${f1(led[0])}" cy="${f1(led[1])}" r="1.6"/>`;
}

function sceneSvg(f) {
  const node = { home: [-GAP, 0], solar: [0, -GAP], grid: [0, GAP], battery: [GAP, 0] };
  const edge = { home: [-GAP + TILE / 2, 0], solar: [0, -GAP + TILE / 2], grid: [0, GAP - TILE / 2], battery: [GAP - TILE / 2, 0] };
  // [power, towards the middle?]: each line's dots run from where the power comes from to where it goes
  const flow = { solar: [f.solar, true], home: [f.house, false], grid: f.buy >= ON_KW ? [f.buy, true] : [f.sell, false],
                 battery: f.give >= ON_KW ? [f.give, true] : [f.charge, false] };
  const hub = iso(0, 0, THICK / 2);
  let links = "";
  for (const key of ["solar", "home", "grid", "battery"]) {
    const end = iso(edge[key][0], edge[key][1], THICK / 2), [power, inwards] = flow[key], on = power >= ON_KW;
    links += `<line class="iso-link${on ? " on" : ""}" x1="${f1(end[0])}" y1="${f1(end[1])}" x2="${f1(hub[0])}" y2="${f1(hub[1])}" style="--c: var(--c-${key})"/>`;
    if (!on) continue;
    const [a, b] = inwards ? [end, hub] : [hub, end];
    const speed = 12 + 18 * Math.sqrt(Math.min(power, 12)), deg = Math.round(Math.atan2(b[1] - a[1], b[0] - a[0]) * 180 / Math.PI);
    const style = `style="stroke: var(--c-${key}); --dur: ${(12.01 / speed).toFixed(2)}s"`;
    links += `<line class="iso-dots" x1="${f1(a[0])}" y1="${f1(a[1])}" x2="${f1(b[0])}" y2="${f1(b[1])}" ${style}/>` +
             `<path class="iso-chev" d="M-3.5 -4.5 L1.5 0 L-3.5 4.5" transform="translate(${f1((a[0] + b[0]) / 2)} ${f1((a[1] + b[1]) / 2)}) rotate(${deg})" ${style}/>`;
  }
  const defs = `<defs>
    <linearGradient id="iso-side" x1="0" x2="1" y1="0" y2="0"><stop offset="0" style="stop-color: var(--iso-tile-left)"/><stop offset="0.47" style="stop-color: var(--iso-tile-left)"/>
      <stop offset="0.53" style="stop-color: var(--iso-tile-right)"/><stop offset="1" style="stop-color: var(--iso-tile-right)"/></linearGradient>
    <linearGradient id="iso-glass" x1="0" x2="0" y1="0" y2="1"><stop offset="0" style="stop-color: var(--iso-panel-hi)"/><stop offset="1" style="stop-color: var(--iso-panel)"/></linearGradient>
    <linearGradient id="iso-charge" x1="0" x2="0" y1="0" y2="1"><stop offset="0" style="stop-color: var(--iso-bat-level-hi)"/><stop offset="1" style="stop-color: var(--iso-bat-level)"/></linearGradient>
  </defs>`;
  // back to front: the solar panels, the house and the battery, then the grid
  return defs + links + `<circle class="iso-hub" cx="${f1(hub[0])}" cy="${f1(hub[1])}" r="7"/>` +
    tileSvg(...node.solar) + solarSvg(...node.solar) + tileSvg(...node.home) + houseSvg(...node.home) +
    tileSvg(...node.battery) + batterySvg(...node.battery, f.pct == null ? 0 : f.pct) + tileSvg(...node.grid) + gridSvg(...node.grid);
}

function watts(kwValue) {           // as FoxESS shows power: watts under 1 kW, then kW
  const v = Math.max(0, kwValue || 0);
  return v < 1 ? `${Math.round(v * 1000)}<small>W</small>` : `${v.toFixed(v >= 10 ? 1 : 2)}<small>kW</small>`;
}
function sceneLabel(x, y, right, label, valueHtml) {
  return `<div class="iso-label${right ? " right" : ""}" style="left: ${((x - SCENE.x) / SCENE.w * 100).toFixed(2)}%; top: ${((y - SCENE.y) / SCENE.h * 100).toFixed(2)}%">
    <div class="k">${esc(label)}</div><div class="v">${valueHtml}</div></div>`;
}

// ---- the price now, and room for a wash or a dry (2026-11-13). Outside the cheap windows the inverter gives
// at most 5 kW (solar and battery together): above that, and once the battery is down to its floor, power is bought
// at the dear rate. So a machine can run outside a window if it keeps the house under 5 kW and the battery still lasts
// until the next window. The figures come from app-data.json's "room" (the daily job: energy_tracker/app.py).
const SHOWER_KW = 7;                 // the house above this means the shower's on: nothing else big now (the main fuse),
                                     // except in the free hours: showers and machines together are fine then (the owner's choice, 2026-11-14)
const ROOM_MARGIN_KW = 0.3;          // keep a little under the 5 kW: the house's own use moves about
const NEED_MARGIN = 1.15;            // the battery should have a little more than the house usually needs before then
function londonNow(d = new Date()) {
  const p = Object.fromEntries(PARTS_FMT.formatToParts(d).map(x => [x.type, x.value]));
  return { minute: (+p.hour % 24) * 60 + +p.minute, weekday: weekdayOf(`${p.year}-${p.month}-${p.day}`) };
}
function tariffNow(prices, d = new Date()) {
  // the price now, when it next changes, and when the cheapest everyday price next starts (minute by minute, 2 days on)
  if (!prices || !(prices.import_bands || []).length) return null;
  const { minute, weekday } = londonNow(d);
  const now = priceFor(prices, weekday, minute);
  if (now == null) return null;
  const cheap = Math.min(...prices.import_bands.map(b => b[2]));
  let change = null, next = null, cheapEnd = null;            // cheapEnd: when a cheap or free spell is over
  for (let k = 1; k <= 2 * 1440; k++) {
    const m = minute + k, p = priceFor(prices, (weekday + Math.floor(m / 1440)) % 7, m % 1440);
    if (change == null && p !== now) change = { in: k, p };
    if (next == null && now > cheap && p <= cheap) next = { in: k, p };
    if (cheapEnd == null && now <= cheap && p > cheap) cheapEnd = k;
    if (change && (now > cheap ? next : cheapEnd)) break;
  }
  return { p: now, cheap: now <= cheap, change, next, cheapEnd };
}
function duration(minutes) {
  const h = Math.floor(minutes / 60), m = minutes % 60;
  return h ? `${h} h${m ? ` ${m} min` : ""}` : `${m} min`;
}
function needUntil(need, d, minutes) {
  // the house's typical use less solar from now for `minutes`, half hour by half hour (the current one in part)
  const start = londonNow(d).minute;
  let total = 0;
  for (let m = start; m < start + minutes;) {
    const step = Math.min((Math.floor(m / 30) + 1) * 30, start + minutes) - m;
    total += (need[Math.floor((m % 1440) / 30)] || 0) * step / 30;
    m += step;
  }
  return Math.max(0, total);
}
function roomAnswer(m, f, room, t, d) {
  const at = k => clock(new Date(d.getTime() + k * 60000));
  const free = t.p === 0;              // the free Sunday hours: no main-fuse cautions then (the owner's choice, 2026-11-14)
  if (f.house >= SHOWER_KW && !free) return { kind: "wait", flag: "After the shower", why: "Nothing else big while the shower's on: it's a lot for the main fuse at once." };
  if (t.cheap) {
    const runsOver = t.cheapEnd != null && m.minutes > t.cheapEnd;
    const charging = !free && m.key === "both" && f.charge >= 2 ? " The battery's charging too, so nothing else big at the same time." : "";
    return { kind: "yes", flag: "Yes", why: `${cheapWords(t, at)}.` +
             (runsOver ? ` It would finish about ${at(m.minutes)}, so the end runs on the battery.` : "") + charging };
  }
  const later = t.next ? `at ${at(t.next.in)}` : "in the next cheap window";
  if (f.solar - f.house >= m.kw) return { kind: "yes", flag: "Yes", why: "Spare solar covers it right now." };
  if (f.house + m.kw > room.inverter_kw - ROOM_MARGIN_KW) {

             why: `The battery has about ${kwh(have)} kWh, and the house usually needs about ${kwh(need)} before ${at(t.next.in)}, ` +
                  `so it will run out anyway: anything extra now is bought at ${pence(t.p)}.` };

  if (have >= need * NEED_MARGIN + m.kwh) {

           why: `The battery has about ${kwh(have)} kWh, and the house usually needs about ${kwh(need)} before ${at(t.next.in)}. ` +

// ---- when to start the machines (2026-11-14): the deep dive's fixed rules (its section 3), worked out from the cheap
// spells in the prices, so they follow the tariff. Machines only in spells that start 06:00-23:00 (fire-service advice:
// not overnight or while everyone's out). The dryer runs about 1 3/4 hours and a hot wash heats in its first hour, so
// each has a latest start; the dishwasher heats 10-20 minutes in. In a free spell (Tide Lifestyle's Sundays) they're
// staggered: the dryer and the oven at the start, a hot wash 20 minutes in, the dishwasher about an hour in.
const START_RULES = [["The dryer", 105], ["A hot wash", 60], ["The dishwasher", 60]];   // [name, minutes before the spell ends]

function priceSpells(prices, d, test) {
  // runs of minutes, today and tomorrow (UK), where test(price) holds: [{a, b}] in minutes from today's midnight
  const { weekday } = londonNow(d), out = [];
  let from = null;
  for (let m = 0; m <= 2880; m++) {
    const ok = m < 2880 && test(priceFor(prices, (weekday + Math.floor(m / 1440)) % 7, m % 1440));
    if (ok && from == null) from = m;

}
function startCard(prices) {
  if (!prices || new Set((prices.import_bands || []).map(b => b[2])).size < 2) return "";   // one price all day
  const d = new Date(), now = londonNow(d).minute, cheap = Math.min(...prices.import_bands.map(b => b[2]));
  const usable = priceSpells(prices, d, p => p <= cheap).filter(s => s.a % 1440 >= 6 * 60 && s.a % 1440 < 23 * 60 && s.b > now);
  const rows = START_RULES.map(([name, before]) => {
    const s = usable.find(x => x.b - before >= Math.max(x.a, now));
    if (!s) return "";
    const when = now >= s.a ? "Now" : `${minuteClock(s.a % 1440)}${s.a >= 1440 ? " tomorrow" : ""}`;
    return `<tr><th scope="row">${esc(name)}</th><td>${esc(when)}</td><td>by ${esc(minuteClock((s.b - before) % 1440))}</td></tr>`;
  }).join("");
  const free = priceSpells(prices, d, p => p === 0).find(x => x.b > now && x.b - x.a >= 60);
  let plan = "";
  if (free) {
    const at = k => minuteClock((free.a + k) % 1440), end = minuteClock(free.b % 1440);
    const evening = free.a >= 1440 ? usable.find(x => x.a < 1440 && x.b - 60 >= Math.max(x.a, now)) : null;
    const order = now >= free.a ? `<b>Free until ${end}.</b> Anything started now runs free until then (a few minutes apart). Showers are fine too.`
      : `<b>${free.a >= 1440 ? "Tomorrow" : "Today"} ${at(0)}–${end} is free.</b> At ${at(0)} the dryer and the oven (on a short delay: raw meat ` +
        `shouldn't sit out for hours), at ${at(20)} a hot wash, and about ${at(60)} the dishwasher. Showers are fine then too.`;
    plan = `<div class="start-free"><p>${order}</p>` +
      (evening ? `<p class="fine">${now >= evening.a ? "Now" : `At ${minuteClock(evening.a)}`}: a wash, so the dryer has a load for the free hours (on the airer overnight).</p>` : "") +
      `</div>`;
  }

    (rows ? `<div class="table-wrap"><table class="appliance-table" aria-label="The next good time to start each machine"><tbody>${rows}</tbody></table></div>` : "") +
    `<p class="fine" style="margin-top: 8px">In the cheap windows, never overnight or while everyone's out (fire-service advice). The dryer runs about 1¾ hours and a hot wash heats in its first hour, so each has a latest start.</p>`);
}

// ---- money for a day: FoxESS's meter totals, priced by when the power was used, at today's prices
function usedKwh(t) {
  // what came in less what went out, as FoxESS's app shows it; without a solar figure, FoxESS's own house meter
  // (version 3 of the live script sends it), which leaves out a few per cent of losses
  const need = ["solar", "gave", "bought", "charged", "sold"];
  return need.every(k => num(t[k]) != null) ? Math.max(0, t.solar + t.gave + t.bought - t.charged - t.sold) : num(t.house);
}
function priceAt(bands, minute) {
  for (const [start, end, p] of bands || []) {
    if (start === end) return p;
    if (start < end && minute >= start && minute < end) return p;
    if (start > end && (minute >= start || minute < end)) return p;
  }
  return null;
}
function weekdayOf(date) { return (new Date(date + "T12:00:00Z").getUTCDay() + 6) % 7; }     // Monday 0, as the tracker counts
function priceFor(prices, weekday, minute) {
  // the import price at that time on that day: a day-only price first (Tide Lifestyle's free Sundays), else the bands
  for (const [days, start, end, p] of prices.import_special || []) {
    if (days.includes(weekday) && minute >= start && minute < end) return p;
  }
  return priceAt(prices.import_bands, minute);
}
function steps(d, fn) {
  // each 5-minute step of a day: its length in hours and its middle (seconds after midnight)
  const t = d.points.t;
  for (let i = 1; i < t.length; i++) {
    const h = (t[i] - t[i - 1]) / 3600;
    if (h > 0 && h <= 0.5) fn(i, h, (t[i] + t[i - 1]) / 2);

}

function energy(d, col, i, h) { return (at(d, col, i) + at(d, col, i - 1)) / 2 * h; }

  // 5-minute readings added up. [kWh, true when from the readings]
  const meter = key === "house" ? usedKwh(d.totals || {}) : num((d.totals || {})[key]);
  if (meter != null || !d.points || !d.points.t || d.points.t.length < 2) return [meter, false];
  let sum = 0;
  steps(d, (i, h) => { sum += energy(d, key, i, h); });
  return [sum, true];
}

function dayMoney(d) {
  const prices = daily && daily.prices;
  if (!prices || !prices.import_bands || !d.points || !d.totals) return null;
  const sum = { buy: [0, 0], sell: [0, 0], use: [0, 0] };
  const weekday = weekdayOf(d.date);
  steps(d, (i, h, mid) => {
    const minute = clockMinute(d.start + mid);
    const pi = priceFor(prices, weekday, minute), pe = priceAt(prices.export_bands, minute) || 0;
    if (pi == null) return;
    for (const [k, col, p] of [["buy", "buying", pi], ["sell", "selling", pe], ["use", "house", pi]]) {
      const e = energy(d, col, i, h);
      sum[k][0] += e; sum[k][1] += e * p;
    }
  });
  const flat = priceAt(prices.import_bands, 12 * 60) || 0;
  const avg = (k, fallback) => sum[k][0] > 0.01 ? sum[k][1] / sum[k][0] : fallback;
  const t = d.totals, used = usedKwh(t);
  if (num(t.bought) == null || used == null) return null;
  const paid = t.bought * avg("buy", flat), earned = (t.sold || 0) * avg("sell", priceAt(prices.export_bands, 12 * 60) || 0);
  const standing = prices.standing_p_day || 0;
  return { spent: (paid + standing - earned) / 100, saved: (used * avg("use", flat) - paid + earned) / 100, standing };
}

function freeSpells(p) {
  // the free spells in the prices, in words (Tide Lifestyle: ["Sundays 12:00–14:00"])
  const names = ["Mondays", "Tuesdays", "Wednesdays", "Thursdays", "Fridays", "Saturdays", "Sundays"];
  const hhmm = m => `${String(Math.floor(m / 60)).padStart(2, "0")}:${String(m % 60).padStart(2, "0")}`;
  return ((p && p.import_special) || []).filter(s => !s[3]).map(([days, start, end]) => `${and(days.map(n => names[n]))} ${hhmm(start)}–${hhmm(end)}`);
}

function priceWords() {
  const p = daily && daily.prices;
  if (!p) return "";
  const rates = [...new Set((p.import_bands || []).map(b => b[2]))].sort((a, b) => a - b);
  const exp = [...new Set((p.export_bands || []).map(b => b[2]))];
  const unit = rates.length === 1 ? `${pence(rates[0])} a unit` : `${pence(rates[0])} to ${pence(rates[rates.length - 1])} a unit`;
  const free = freeSpells(p).map(spell => `free on ${spell}`);
  return `Money at today's prices (${esc(p.import)}: ${unit}${free.length ? `, ${free.join(", ")}` : ""}, ${pence(p.standing_p_day)} a day; ${exp.every(v => !v) ? "exports aren't paid" : `exports earn ${exp.map(pence).join(" to ")}`}).`;

function hourRows(d) {
  // kWh in each hour from the 5-minute readings, scaled so each column adds up to FoxESS's meter total
  const cols = { solar: "solar", house: "house", bought: "buying", sold: "selling", charged: "charging", gave: "giving" };
  const rows = [];
  steps(d, (i, h, mid) => {
    const n = Math.floor(mid / 3600);
    const row = rows[n] || (rows[n] = { n, level: null });
    for (const [name, col] of Object.entries(cols)) row[name] = (row[name] || 0) + energy(d, col, i, h);
    const level = d.points.battery && d.points.battery[i];

  const list = rows.filter(Boolean);
  for (const [name, total] of Object.entries(meter)) {
    const sum = list.reduce((a, r) => a + (r[name] || 0), 0);
    if (num(total) != null && sum > 0.05) list.forEach(r => { r[name] = (r[name] || 0) * total / sum; });

}

// ---- the energy card: a day's power every 5 minutes, or each day of a month, or each month of a year.
// What came in (solar, the battery, the grid) is stacked above the line, and where it went (the house,
// the battery, the grid) below it, as in FoxESS's own app.
const IN = [["solar", "Solar"], ["battery", "From the battery"], ["grid", "Bought"]];
const OUT = [["home", "House"], ["battery", "Into the battery"], ["grid", "Sold"]];
const CHIPS = [["solar", "Solar"], ["battery", "Battery"], ["grid", "Grid"], ["home", "House"]];
const MODES = [["day", "Day"], ["week", "Week"], ["month", "Month"], ["year", "Year"], ["total", "Total"]];

const view = { mode: MODES.some(([k]) => k === store("energy-mode")) ? store("energy-mode") : "day",
               day: "", week: "", month: "", year: "", total: "", error: "", loading: "", before: null, last: null, tried: {} };
const RETRY_MS = 2 * 60 * 1000;     // a period is asked for again at most this often (a failed refresh would otherwise loop)

async function getAnswer(kept, key, params, keepMinutes) {
  const found = kept[key];
  if (found && Date.now() - found.at < keepMinutes * 60000) return found.answer;
  const answer = await ask(params);
  if (!(answer.version >= 2)) throw new Error("the live script needs its update first");
  kept[key] = { at: Date.now(), answer };
  return answer;
}
function balanceRow(get, i, from) {
  // one day's or month's figures (from: its first day). Null when FoxESS has nothing for it; solar null before
  // its solar meter started, and the house then from FoxESS's own house meter when the script sends it.
  const v = k => num(get[k] && get[k][i]);
  const solar = v("solar"), bought = v("bought"), sold = v("sold"), charged = v("charged"), gave = v("gave");
  if ([bought, sold, charged, gave].some(x => x == null) || ![solar, bought, sold, charged, gave].some(Boolean)) return null;

// Month and year totals are kept by period. A copy fetched while the period was still going on is kept

function monthKey(m) { return m === londonDate().slice(0, 7) ? m + " so far" : m; }
function yearKey(y) { return y === londonDate().slice(0, 4) ? y + " so far" : y; }

function keptYear(y) { const f = extra.years[yearKey(y)]; return f ? f.answer : null; }

function barRows(sel, a) {

function energyModel(sel, a) {

             up: { solar: col("solar"), battery: col("giving"), grid: col("buying") },

    const tiles = [tile("Solar made", kwh(solar), "kWh", "solar", solarRead ? read : ""), tile("House used", kwh(house), "kWh", "home", houseRead ? read : ""),

    if (money) tiles.push(tile(isToday ? "Spent so far" : "Spent", gbp(money.spent), "", "", `with the ${pence(money.standing)} daily charge`),

function periodStart(sel) {

}
function gapNote(m) {

  }

function energyTable(m) {

// ---- drawing the chart (once the page knows how wide it is)

function watchSize() {

  if (!("ResizeObserver" in window)) return;

      const box = document.getElementById("energy-chart");
      if (box && chart && Math.abs(box.clientWidth - chart.W) > 3) drawEnergy();

function drawEnergy() {
